<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>作成ツールメニュー</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', sans-serif;
            padding: 20px;
            background: #f0f2f5;
            text-align: center;
        }
        .container {
            max-width: 500px;
            margin: 20px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
        }
        h1 { 
            color: #333; 
            font-size: 22px; 
            margin-bottom: 10px; 
        }
        
        /* カテゴリ見出しのデザイン */
        h2 {
            color: #0369a1;
            font-size: 16px;
            text-align: left;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 6px;
            margin-top: 35px;
            margin-bottom: 15px;
        }

        .btn {
            display: block;
            background: #0ea5e9;
            color: white;
            padding: 14px;
            margin: 10px 0;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 15px;
            transition: all 0.2s;
            box-shadow: 0 2px 4px rgba(14, 165, 233, 0.2);
        }
        .btn:hover { 
            background: #0284c7; 
            transform: translateY(-1px);
        }
        
        /* 3. 画面が広いときだけ2列にする設定（2カラム化） */
        .button-group {
           display: grid;
           gap: 15px;
           grid-template-columns: 1fr; /* 基本は1列 */
        }
        @media (min-width: 768px) {
        .button-group {
           grid-template-columns: repeat(2, 1fr); /* iPadなど広い画面では2列 */
        }
        }

        /* 4. タップした時に押し込むような反応をつける */
        .btn:active {
            transform: translateY(3px) !important;
            box-shadow: 0 1px 2px rgba(0,0,0,0.2) !important;
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>配布資料メニュー</h1>

        <!-- ① 教務関係 -->
        <h2>📚 教務関係</h2>
        <div class="button-group">
        <a class="btn" style="background: #0284c7;" href="system/sekigae.html">✒️　サクッと席替えくん</a>
        <a class="btn" style="background: #0284c7;" href="system/Grades.html">📔　成績表用加工ツール</a>
        <a class="btn" style="background: #0284c7;" href="system/iPad data search.html">💻　iPadデータ検索くん</a>
        </div>

        <!-- ② 電子黒板用 -->
        <h2>🖥️ 電子黒板用</h2>
        <div class="button-group">
        <a class="btn" style="background: #4f46e5;" href="Class Schedule/moshi_schedule.html">📝　模試時間割作成</a>
        <a class="btn" style="background: #4f46e5;" href="Class Schedule/time_keeper.html">⏳　タイムキーパー</a>
        </div>

        <!-- ③ 季節の行事 -->
        <h2>🗓️ 季節の行事</h2>
        <div class="button-group">
        <a class="btn" style="background: #f43f5e;" href="event/Tanabata.html">🎋　七夕のお願い</a>
        <a class="btn" style="background: #f43f5e;" href="event/Christmas_tree.html">🎄　クリスマスツリー</a>
        </div>

        <!-- ④ 特別支援関係 -->
        <h2>🤝 特別支援関係</h2>
        <div class="button-group">
        <a class="btn" style="background: #f97316;" href="special needs/jiritsu.html">🤸　自立活動</a>
        </div>

        <!-- ⑤ ダウンロード -->
        <h2>📥 ダウンロード</h2>
        <div class="button-group">
        <a class="btn" style="background: #10b981;" href="https://github.com/aibusinesschk2024-ux/schooldrive2026/releases" target="_blank">まとめてZIPで保存（先生向け）</a>
        </div>

    </div>
</body>
</html>
